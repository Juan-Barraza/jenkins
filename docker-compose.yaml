services:

  jenkins:
    container_name: jenkins
    build:
      context: ./sonarqube
      dockerfile: Dockerfile
    ports: 
      - "8080:8080"
      - "50000:50000"
    privileged: true
    user: root
    volumes:
      - jenkins_home:/var/jenkins_home 
      - /var/run/docker.sock:/var/run/docker.sock # to run docker in jenkins
    networks:
      - netJ
  postgres:
    container_name: postgres-sonarqube
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonarpasswd
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - netJ

  sonarqube:
    container_name: sonarqube
    image: sonarqube:lts
    platform: linux/amd64
    ports:
      - 9000:9000
      - 9092:9092
    environment:
      SONARQUBE_JDBC_USERNAME: sonar
      SONARQUBE_JDBC_PASSWORD: sonarpasswd
      SONARQUBE_JDBC_URL: "jdbc:postgresql://postgres:5432/sonar"
    depends_on: 
      - postgres
    networks:
      - netJ




volumes:
  jenkins_home:
  postgres-data:  

networks:
  netJ: